name: Build PlayTash APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: flutter create --platforms=android .

      - name: Configure Firebase
        run: |
          if [ -f google-services.json ]; then
            mkdir -p android/app
            cp google-services.json android/app/google-services.json
          else
            echo "Firebase config not found; continuing without Firebase."
          fi

      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle.kts")
          if p.exists():
              s = p.read_text()
              if "com.google.gms.google-services" not in s:
                  s += '\nplugins {\n    id("com.google.gms.google-services") version "4.4.3" apply false\n}\n'
              p.write_text(s)

          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              if 'id("com.google.gms.google-services")' not in s:
                  s = s.replace(
                      'id("com.android.application")',
                      'id("com.android.application")\n    id("com.google.gms.google-services")',
                      1
                  )
              p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTash-APK
          path: build/app/outputs/flutter-apk/app-release.apk
